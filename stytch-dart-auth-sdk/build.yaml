# Build configuration for JSON serialization
targets:
  $default:
    sources:
      include:
        - lib/**
        - test/**
        - bin/**
      exclude:
        - example/**
    builders:
      json_serializable:
        generate_for:
          - lib/src/models/*.dart
        options:
          # Enable strict null safety
          any_map: false
          # Generate toJson/fromJson for all classes
          checked: true
          # Include required fields in generated code
          explicit_to_json: true
          # Generate equals and hashCode methods
          generate: true
          # Include fields that are not final
          include_if_null: false
