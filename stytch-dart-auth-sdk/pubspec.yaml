name: stytch_dart_auth_sdk
description: A Dart SDK for stytch Authentication, enabling secure server-side authentication and user management for Dart-based backend applications.
version: 0.0.1
repository: https://github.com/aortem/stytch_dart_auth_sdk
license: BSD-3

environment:
  sdk: ^3.10.1

# Add regular dependencies here.

dependencies:
#------------------ STANDARD FEATURES---------------------------------
## There are three standard libraries.  Each one can be used with a different xxx 

  ds_standard_features: ^0.1.4 #Standard Dart Team Utilities For HTTP //Default
  build_web_compilers: ^4.4.3
  jwt_generator: ^0.0.8


#------------------ TESTING FEATURES---------------------------------

dev_dependencies:
  ds_tools_testing: ^0.1.3 #Standard Dart Team Testing Tools
  git_hooks: any

# Optional Local Hooks for development.
git_hooks:
  hooks:
    pre-commit: ./local_dev_tools/validate_commit.dart
    commit-msg: ./local_dev_tools/validate_commit_msg.dart
    pre-push: ./local_dev_tools/validate_branch.dart